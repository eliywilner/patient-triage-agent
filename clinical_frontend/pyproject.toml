[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-frontend"
version = "0.1.0"
description = "Doctor Triage Portal for Patient Triage Agent"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-adk[gcp]>=2.7.0",
    "google-cloud-aiplatform>=1.60.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

